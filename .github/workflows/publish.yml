name: Publish packages

# On every push to main, changesets/action does one of two things:
# - pending changesets: open or update the "Version Packages" pull request, which
#   bumps versions and writes changelogs;
# - no pending changesets (that pull request was just merged): publish every
#   package whose version is not in the registry yet, then tag and release it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4

      # Writes an .npmrc that points @janodetzel at GitHub Packages and reads
      # NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@janodetzel"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm depcruise

      # Pinned to v1: changesets/action v2 requires @changesets/cli v3, which needs pnpm 10.
      - uses: changesets/action@v1.9.0
        with:
          publish: pnpm changeset publish
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
